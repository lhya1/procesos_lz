<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesos LZ | Soft Aesthetic & Spirit</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Montserrat:wght@300;400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Librería AOS para efectos de transición al deslizar -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --bg-light: #edf2f7;
            --blue-pastel: #9cb2c9;
            --blue-soft: #baccdb;
            --blue-ui: #7b9bb9;
            --text-dark: #2c353f;
            --text-muted: #6c7a89;
            --card-white: #ffffff;
            --radius-ui: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Quicksand', 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 🌊 FONDO ANIMADO DE MAR */
        .sea-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            background: linear-gradient(180deg, #f4f6f9 0%, #e2e9f0 50%, #c9d8e6 100%);
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 200%;
            height: 300px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="rgba(156, 178, 201, 0.25)"></path></svg>') repeat-x;
            animation: waveMove 18s linear infinite;
        }

        .wave.wave2 {
            bottom: -30px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C200,40 400,10 600,50 C800,90 1000,30 1200,80 L1200,120 L0,120 Z" fill="rgba(255, 255, 255, 0.5)"></path></svg>') repeat-x;
            animation: waveMove 12s linear infinite reverse;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* NAVEGACIÓN */
        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 30px 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: rgba(237, 242, 247, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--blue-ui);
        }

        /* SECCIÓN HERO INTRODUCCIÓN */
        .hero-section {
            position: relative;
            max-width: 1100px;
            margin: 40px auto 80px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
        }

        .hero-subtitle {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
        }

        .hero-number {
            font-family: 'Bodoni Moda', serif;
            font-size: 3.5rem;
            display: inline-block;
            margin-right: 15px;
        }

        .hero-script {
            font-family: 'Alex Brush', cursive;
            font-size: 2.2rem;
        }

        .hero-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 320px;
            margin-top: 15px;
        }

        .hero-img-box text-align: right; {
            text-align: right;
        }

        .hero-img-box img {
            max-width: 80%;
            border-radius: var(--radius-ui);
            box-shadow: 0 10px 25px rgba(156, 178, 201, 0.3);
        }

        /* SECCIÓN GENERAL TITULOS */
        .section-header-tag {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--blue-ui);
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* 📸 SECCIÓN IMÁGENES SOFT UI & COLLAGE */
        .aesthetic-gallery {
            max-width: 1000px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .ui-window-card {
            background: var(--card-white);
            border-radius: var(--radius-ui);
            padding: 24px;
            box-shadow: 0 15px 35px rgba(156, 178, 201, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
        }

        .ui-search-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .ui-window-body {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 25px;
            align-items: center;
        }

        .ui-window-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 16px;
        }

        .ui-badge-container {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .ui-chip {
            background: #e2e8f0;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .ui-text-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .ui-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            background: var(--blue-pastel);
            color: #fff;
            transition: all 0.2s;
        }

        .ui-btn:hover {
            background: var(--blue-ui);
        }

        /* 📖 NUEVA SECCIÓN: PEQUEÑAS HISTORIAS (CARDS ELEGANTES) */
        .stories-section {
            max-width: 1000px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 25px;
        }

        .story-card {
            background: var(--card-white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(156, 178, 201, 0.15);
            border: 1px solid #e2e8f0;
            position: relative;
            transition: transform 0.3s ease;
        }

        .story-card:hover {
            transform: translateY(-5px);
        }

        .story-tag {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--blue-ui);
            font-weight: 600;
        }

        .story-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.25rem;
            margin: 10px 0;
            color: var(--text-dark);
        }

        .story-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .story-footer {
            font-family: 'Alex Brush', cursive;
            font-size: 1.5rem;
            margin-top: 15px;
            color: var(--blue-ui);
            text-align: right;
        }

        /* ✍️ NUEVA SECCIÓN: ESPACIO DE LECTURA Y ESCRITURA */
        .writing-section {
            max-width: 1000px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .writing-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(237, 242, 247, 0.7));
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.04);
            border: 2px solid #fff;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 35px;
            align-items: center;
        }

            width: 100%;
            height: 3
